<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7FA4E8">
<title>DesvendaLetra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
  <symbol id="i-cog" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
</svg>

<div class="app">
  <header class="topo">
    <h1 class="titulo">DesvendaLetra</h1>
    <button class="btn-icone" id="btn-conta" aria-label="Minha conta"><svg class="ic"><use href="#i-user"/></svg></button>
  </header>

  <div class="status" aria-live="polite">
    <span class="chip" id="st-modo">Individual</span>
    <span id="st-info">Fácil · 5 letras</span>
    <span class="st-tent" id="st-tent">1/20</span>
  </div>
  <div class="vez" id="st-vez" hidden></div>

  <main class="tabuleiro" id="tabuleiro" aria-label="Tabuleiro"></main>

  <div class="toast" id="toast" role="status" aria-live="assertive"></div>

  <div class="teclado" id="teclado" aria-label="Teclado"></div>

  <nav class="barra" aria-label="Menu">
    <button data-nav="I" aria-label="Modo individual"><b>I</b><small>Individual</small></button>
    <button data-nav="D" aria-label="Modo dupla, mesma tela"><b>D</b><small>Dupla</small></button>
    <button data-nav="M" aria-label="Multiplayer"><b>M</b><small>Online</small></button>
    <button data-nav="mundial" aria-label="Ranking mundial"><svg class="ic"><use href="#i-globe"/></svg><small>Mundial</small></button>
    <button data-nav="stats" aria-label="Estatísticas"><svg class="ic"><use href="#i-trophy"/></svg><small>Estatísticas</small></button>
    <button data-nav="config" aria-label="Configurações"><svg class="ic"><use href="#i-cog"/></svg><small>Config</small></button>
  </nav>
</div>

<!-- Tela de transição da Dupla: cobre tudo para um não ver as tentativas do outro -->
<div class="transicao" id="transicao" hidden>
  <p class="tr-sub">Passe o aparelho para</p>
  <p class="tr-nome" id="tr-nome">Jogador 2</p>
  <p class="tr-dica">Não espie as tentativas do outro!</p>
  <button class="btn grande" id="tr-ok">Estou pronto</button>
</div>

<!-- popover: fica acima até da janela de fim de jogo -->
<canvas id="confete" popover="manual" aria-hidden="true"></canvas>

<dialog id="dlg" aria-labelledby="dlg-titulo">
  <div class="dlg-cab">
    <h2 id="dlg-titulo"></h2>
    <button class="btn-icone" data-fechar aria-label="Fechar"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div id="dlg-corpo"></div>
</dialog>

<script src="palavras.js"></script>
<script src="jogo.js"></script>
</body>
</html>
